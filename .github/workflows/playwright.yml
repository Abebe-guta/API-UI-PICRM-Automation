name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    env:
      # =========================
      # WEB CONFIG
      # =========================
      BASE_URL: ${{ secrets.BASE_URL }}
      LOGIN_USERNAME: ${{ secrets.LOGIN_USERNAME }}
      LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      # =========================
      # DB CONFIG
      # =========================
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_SSL: ${{ secrets.DB_SSL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Create .auth directory
        run: mkdir -p .auth

      - name: Run API tests
        run: npx playwright test --project=API

      - name: Run Segment Journey Tests
        run: npx playwright test --project=JOURNEY

      - name: Run Screening Feature Tests
        run: npx playwright test --project=SCREENING

      - name: Run UI DB Validation Tests
        run: npx playwright test --project=ui-ANALYTICS

      - name: Run DB tests
        run: npx playwright test --project=DB

      - name: List generated report files
        if: always()
        run: |
          echo "=== playwright-report ==="
          ls -la playwright-report/ 2>/dev/null || echo "playwright-report/ not found"
          echo "=== test-results ==="
          ls -la test-results/ 2>/dev/null || echo "test-results/ not found"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-output
          path: |
            playwright-report/
            test-results/
          retention-days: 30
